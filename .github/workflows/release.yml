name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build MSI and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: cargo test --workspace

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-installer.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $msi = "target\installer\stayline-$env:VERSION.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  stayline-$env:VERSION.msi" | Out-File "$msi.sha256" -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target\installer\stayline-$env:VERSION.msi" `
            "target\installer\stayline-$env:VERSION.msi.sha256" `
            --title "Stayline VPN $env:VERSION" --generate-notes

  android:
    name: Build Android APKs and attach them
    # The MSI job creates the release; this one adds to it.
    needs: release
    runs-on: ubuntu-24.04
    env:
      # Pinned so F-Droid's rebuild of the same tag produces the same APKs.
      NDK_VERSION: 28.2.13676358
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.STAYLINE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STAYLINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          STAYLINE_KEYSTORE_PASSWORD: ${{ secrets.STAYLINE_KEYSTORE_PASSWORD }}
          STAYLINE_KEY_ALIAS: ${{ secrets.STAYLINE_KEY_ALIAS }}
          STAYLINE_KEY_PASSWORD: ${{ secrets.STAYLINE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name and checksum the APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir out
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "out/stayline-$version-$abi.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*
